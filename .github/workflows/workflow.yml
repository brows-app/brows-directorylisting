name: Workflow

on:
  push:
    branches: [ dev ]
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.x'
  CUSTOM_PACK_OUTPUT: ${{ github.workspace }}/pack-output

jobs:
  workflow:
    name: Build, test, pack, and push
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Version
      if: github.event_name == 'release'
      env:
        RELEASE_NAME: ${{ github.event.release.name }}
      run: |
           $name = $env:RELEASE_NAME
           if ([string]::IsNullOrWhiteSpace($name)) {
             throw "The release name is empty."
           }
           $prefix, $suffix = $name.Trim() -split '-', 2
           if ([string]::IsNullOrWhiteSpace($prefix)) {
             throw "The release name '$name' has no version prefix."
           }
           if ($null -eq $suffix) {
             $suffix = ''
           }
           $file = Resolve-Path 'Directory.Build.props'
           $props = New-Object System.Xml.XmlDocument
           $props.PreserveWhitespace = $true
           $props.Load($file)
           $prefixNode = $props.SelectSingleNode('/Project/PropertyGroup/VersionPrefix')
           $suffixNode = $props.SelectSingleNode('/Project/PropertyGroup/VersionSuffix')
           if ($null -eq $prefixNode -or $null -eq $suffixNode) {
             throw "'$file' has no VersionPrefix or VersionSuffix element."
           }
           $prefixNode.InnerText = $prefix
           $suffixNode.InnerText = $suffix
           $props.Save($file)
           Write-Host "VersionPrefix=$prefix VersionSuffix=$suffix"

    - name: Restore
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
    
    - name: Test
      run: dotnet test --no-restore --configuration Release --no-build --verbosity normal

    - name: NuGet login
      if: github.event_name == 'release'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Pack
      if: github.event_name == 'release'
      run: dotnet pack --no-restore --configuration Release --no-build --output ${{ env.CUSTOM_PACK_OUTPUT }} -p:ContinuousIntegrationBuild=true

    - name: Verify package notices
      if: github.event_name == 'release'
      shell: pwsh
      run: |
           Add-Type -AssemblyName System.IO.Compression.FileSystem
           $packages = @(Get-ChildItem -LiteralPath $env:CUSTOM_PACK_OUTPUT -Filter '*.nupkg' -File)
           if ($packages.Count -eq 0) {
             throw 'No NuGet package was created.'
           }

           $expectedLicenseHash = (Get-FileHash -LiteralPath 'LICENSE' -Algorithm SHA256).Hash
           foreach ($package in $packages) {
             $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
             try {
               $licenseEntry = $archive.GetEntry('LICENSE')
               $noticeEntry = $archive.GetEntry('THIRD-PARTY-NOTICES.md')
               if ($null -eq $licenseEntry -or $null -eq $noticeEntry) {
                 throw "Package '$($package.Name)' is missing LICENSE or THIRD-PARTY-NOTICES.md."
               }

               $licenseStream = $licenseEntry.Open()
               $licenseBuffer = [System.IO.MemoryStream]::new()
               try {
                 $licenseStream.CopyTo($licenseBuffer)
                 $packedLicenseHash = [Convert]::ToHexString(
                   [System.Security.Cryptography.SHA256]::HashData($licenseBuffer.ToArray()))
               }
               finally {
                 $licenseStream.Dispose()
                 $licenseBuffer.Dispose()
               }
               if ($packedLicenseHash -ne $expectedLicenseHash) {
                 throw "Package '$($package.Name)' does not contain the repository LICENSE text."
               }

               $noticeStream = $noticeEntry.Open()
               $noticeReader = [System.IO.StreamReader]::new($noticeStream)
               try {
                 $notice = $noticeReader.ReadToEnd()
               }
               finally {
                 $noticeReader.Dispose()
               }
               if ($notice -notmatch 'Copyright \(C\) 2004-2024 Tim Kosse' -or
                   $notice -notmatch 'C# port' -or
                   $notice -notmatch 'modified') {
                 throw "Package '$($package.Name)' has an incomplete third-party notice."
               }

               $nuspecEntry = $archive.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
               if ($null -eq $nuspecEntry) {
                 throw "Package '$($package.Name)' has no nuspec."
               }
               $nuspecStream = $nuspecEntry.Open()
               $nuspecReader = [System.IO.StreamReader]::new($nuspecStream)
               try {
                 [xml]$nuspec = $nuspecReader.ReadToEnd()
               }
               finally {
                 $nuspecReader.Dispose()
               }
               $namespace = [System.Xml.XmlNamespaceManager]::new($nuspec.NameTable)
               $namespace.AddNamespace('n', $nuspec.DocumentElement.NamespaceURI)
               $license = $nuspec.SelectSingleNode('//n:metadata/n:license', $namespace)
               $copyright = $nuspec.SelectSingleNode('//n:metadata/n:copyright', $namespace)
               if ($null -eq $license -or $license.GetAttribute('type') -ne 'expression' -or
                   $license.InnerText -ne 'GPL-3.0-or-later') {
                 throw "Package '$($package.Name)' does not declare GPL-3.0-or-later."
               }
               if ($null -eq $copyright -or $copyright.InnerText -notmatch 'Tim Kosse') {
                 throw "Package '$($package.Name)' copyright metadata omits Tim Kosse."
               }
             }
             finally {
               $archive.Dispose()
             }
           }

    - name: Push
      if: github.event_name == 'release'
      run: |
           foreach($file in (Get-ChildItem "${{ env.CUSTOM_PACK_OUTPUT }}" -Recurse -Include *.nupkg)) {
             dotnet nuget push $file --api-key "${{steps.login.outputs.NUGET_API_KEY}}" --source https://api.nuget.org/v3/index.json --skip-duplicate
             if ($LASTEXITCODE -ne 0) {
               throw "dotnet nuget push failed for '$file' with exit code $LASTEXITCODE."
             }
           }
